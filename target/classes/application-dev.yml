spring:
  # (opcional) datasource si usas H2 o tu BD local
  # datasource:
  #   driver-class-name: org.h2.Driver
  #   url: jdbc:h2:mem:orders_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  #   username: sa
  #   password:
  # jpa:
  #   hibernate:
  #     ddl-auto: create-drop
  #   show-sql: true

  security:
    user:
      name: ${BASIC_USER:admin}
      password: ${BASIC_PASS:admin123}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

order:
  paging:
    defaultPageSize: ${DEFAULT_PAGE_SIZE:20}
    maxPageSize: ${MAX_PAGE_SIZE:100}

logging:
  level:
    com.example.orders: ${LOG_LEVEL:DEBUG}

server:
  port: ${SERVER_PORT:8080}
